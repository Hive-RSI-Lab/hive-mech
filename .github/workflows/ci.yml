name: ci
# The module's tests on GitHub's standard hosted runner of a public repository (free, no
# minute cap, the person's word on 10-29: nothing that hits a paywall). The Hive reads the
# job as "test (ubuntu-latest)" (forge_tests in .hive/project.json); keep it unnamed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # A PR's superseded run is cancelled; every push to main gets a group of its own.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # bin/mech builds its venv from requirements.lock with uv on first use.
      - uses: astral-sh/setup-uv@v6
      # PrusaSlicer for mech.slicer (pinned in mech/slicer.py), unpacked once and kept.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mech/prusaslicer-2.8.1
          key: prusaslicer-2.8.1-${{ runner.os }}
      - name: the suite (bin/mech test)
        shell: bash
        run: bin/mech test 2>&1 | tee "$RUNNER_TEMP/suite.log"; test "${PIPESTATUS[0]}" = 0
        env:
          MECH_HOME: ${{ runner.temp }}/mech
          MECH_NEED_SLICER: "1"
      # Job logs need a login; annotations don't, so the Hive can read what failed.
      - name: name the failing tests
        if: failure()
        shell: bash
        run: |
          grep -n -E '^_{3,} .+ _{3,}$|^(FAILED|ERROR) ' "$RUNNER_TEMP/suite.log" | head -20 | while IFS=: read -r n _; do
            echo "::error::$(sed -n "$n,$((n + 30))p" "$RUNNER_TEMP/suite.log" | awk 'BEGIN { ORS = "%0A" } { gsub(/\r/, ""); gsub(/%/, "%25"); print substr($0, 1, 300) }')"
          done
  # Main's score, read by the Hive from this job's log instead of a run on its own machine,
  # where worker turns load it past any reading and its measure holds every project's turns
  # (issue #41; the Hive's improve.ScoreJob is its name, improve.ScoreLine its last line). It
  # runs the score command .hive/project.json names, so a change to the score is measured here
  # as it would be there. The score slices nothing, so no PrusaSlicer. A red here is no red on
  # main: the Hive then scores on its own machine.
  score:
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: the score (.hive/project.json's score command)
        shell: bash
        run: |
          cmd=$(python3 -c 'import json; print(json.load(open(".hive/project.json"))["score"]["command"])')
          bash -c "$cmd" 2>&1 | tee "$RUNNER_TEMP/score.log"
          test "${PIPESTATUS[0]}" = 0
          n=$(tail -n 1 "$RUNNER_TEMP/score.log" | awk '{ print $NF }')
          [[ "$n" =~ ^-?[0-9]+(\.[0-9]+)?$ ]]
          echo "hive-score: $n"
        env:
          MECH_HOME: ${{ runner.temp }}/mech
