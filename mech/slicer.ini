# mech slice's PrusaSlicer profile: the hifi receiver's own print settings
# (enclosure/README.md: PETG, 0.4 mm nozzle, 0.2 mm layers, 4 walls, 20 %
# infill) on a Prusa MK4-sized machine with its speeds and limits, so print
# time is what such a printer takes. An enclosure's SLICE = {...} overrides
# any key here (PrusaSlicer's own option names).

# printer
printer_technology = FFF
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 220
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 2500
machine_max_acceleration_retracting = 1200
machine_max_acceleration_travel = 3000
machine_max_acceleration_x = 4000
machine_max_acceleration_y = 4000
machine_max_acceleration_z = 200
machine_max_acceleration_e = 2500
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 40
machine_max_feedrate_e = 100
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 2
machine_max_jerk_e = 10
retract_length = 0.8
retract_speed = 35
min_layer_height = 0.07
max_layer_height = 0.3
start_gcode =
end_gcode =
layer_gcode = G92 E0

# print
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
infill_every_layers = 1
support_material = 1
support_material_auto = 1
support_material_threshold = 45
support_material_style = grid
support_material_contact_distance = 0.2
support_material_spacing = 2
support_material_interface_layers = 2
perimeter_speed = 60
external_perimeter_speed = 35
small_perimeter_speed = 35
infill_speed = 120
solid_infill_speed = 100
top_solid_infill_speed = 60
support_material_speed = 60
support_material_interface_speed = 50%
bridge_speed = 30
gap_fill_speed = 40
travel_speed = 200
first_layer_speed = 25
default_acceleration = 2000
perimeter_acceleration = 1000
infill_acceleration = 2000
bridge_acceleration = 1000
first_layer_acceleration = 800
travel_acceleration = 3000
gcode_comments = 0
complete_objects = 0
skirts = 1
brim_width = 0

# filament (PETG)
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 25
temperature = 240
first_layer_temperature = 230
bed_temperature = 85
first_layer_bed_temperature = 85
